<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>The Poke Stop - Admin</title>
	<link rel="stylesheet" href="/site.css">
	<script src="/site.js" defer></script>
</head>

<body>
	<header>
		<div class="hero">
			<h1>The Poke Stop</h1>
			<p>Your Recipe Will Be Added To The Pokedex</p>
		</div>
	</header>

	<ul class="hornav">
  		<li><a href="/">Menu</a></li>
  		<li><a href="/">Contact</a></li>
  		<li><a href="/admin">Add New Items</a></li>
	</ul>
	<div class="form-container">
	<form style="font-size: 25px; margin: 20px;" id="itemForm" name="itemForm" action="#">
		<h2>New Menu Item</h2>
		<label for="title">Name:</label><br>
  		<input type="text" id="title" name="title"  style="margin-top:20px; margin-bottom:20px; font-size: 20px;"><br>
		<label for="image">Image Link:</label><br>
  		<input type="text" id="image" name="image"  style="margin-top:20px; margin-bottom:20px; font-size: 20px;"><br>
		<label for="description">Description:</label><br>
  		<input type="text" id="description" name="description"  style="margin-top:20px; margin-bottom:20px; font-size: 20px;"><br>
  		<label for="cost">Price:</label><br>
  		<input type="text" id="cost" name="cost"  style="margin-top:20px; margin-bottom:20px; font-size: 20px;"><br>
		<button type="submit" value="Submit Event"  style="margin-top:20px; margin-bottom:20px; font-size: 20px;">Submit Item</button>
	</form>
	<form style="font-size: 25px; margin: 20px;" id="eventForm" name="eventForm" action="#">
		<h2>New Event</h2>
		<label for="title">Name:</label><br>
  		<input type="text" id="title" name="title"  style="margin-top:20px; margin-bottom:20px; font-size: 20px;"><br>
		<label for="location">Location:</label><br>
  		<input type="text" id="location" name="location"  style="margin-top:20px; margin-bottom:20px; font-size: 20px;"><br>
		<label for="date">Date:</label><br>
  		<input type="text" id="date" name="date"  style="margin-top:20px; margin-bottom:20px; font-size: 20px;"><br>
  		<label for="time">Time:</label><br>
  		<input type="text" id="time" name="time"  style="margin-top:20px; margin-bottom:20px; font-size: 20px;"><br>
		<button type="submit" value="Submit Event"  style="margin-top:20px; margin-bottom:20px; font-size: 20px;">Submit Event</button>
	</form>
	<script>
		//Post new menu item from new item form data
		const newItemForm = document.getElementById('itemForm');

		newItemForm.addEventListener('submit', async (e) => {
			e.preventDefault()

			
			const formData = new FormData(newItemForm);
			
			
			const data = Object.fromEntries(formData.entries())

			
			try {
			const response = await fetch('/api/v1/menu', {
				method: 'POST',
				headers: {
				'Content-Type': 'application/json'
				},
				body: JSON.stringify(data)
			});

			if (response.ok) {
				console.log('Success!')
			}
			} catch (error) {
			console.error('Error:', error)
			}

			document.getElementById('itemForm').reset()
		});

		//Post new event from new event form data
		const newEventForm = document.getElementById('eventForm');

		newEventForm.addEventListener('submit', async (e) => {
			e.preventDefault()

			
			const formData = new FormData(newEventForm);
			
			
			const data = Object.fromEntries(formData.entries())

			
			try {
			const response = await fetch('/api/v1/events', {
				method: 'POST',
				headers: {
				'Content-Type': 'application/json'
				},
				body: JSON.stringify(data)
			});

			if (response.ok) {
				console.log('Success!')
			}
			} catch (error) {
			console.error('Error:', error)
			}

			document.getElementById('eventForm').reset()
		});
	</script>
	</div>
</body>

</html>
