<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>The Food Truck</title>
	<link rel="stylesheet" href="/site.css">
	<script src="/site.js" defer></script>
</head>

<body>
	<header>
		<div class="hero">
			<h1>The Food Truck</h1>
			<p>Food straight out of the truck.</p>
		</div>
	</header>

	<ul class="hornav">
  		<li><a href="/">Menu</a></li>
  		<li><a href="/">Contact</a></li>
  		<li><a href="/admin">Login</a></li>
	</ul>

	<div class="sidenav">
		Events
	</div>

	<main class="container">
		<section class="recipe-list">
			<!-- Recipe items will be added here by JavaScript -->
		</section>
	</main>

	<!-- Modal for Recipe Details -->
	 <!-- Use for information about the food -->
	<div class="modal" id="recipeModal">
		<div class="modal-content">
			<span class="close-button">&times;</span>
			<img id="modalImage" src="" alt="Recipe image">
			<h2 id="modalTitle"></h2>
			<p><strong>Price:</strong> <span id="modalCost"></span></p>
			<h3>Ingredients</h3>
			<ul id="modalIngredients"></ul>
		</div>
	</div>

</body>

</html>
